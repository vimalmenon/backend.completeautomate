[tox]
envlist = py313,ruff,black,flake8,mypy
isolated_build = True
skipsdist = True

[testenv]
description = Run tests with pytest
skip_install = true
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-mock>=3.11.1
allowlist_externals = poetry
commands =
    poetry run pytest tests/ -v --cov=backend --cov-report=term-missing --cov-report=html

[testenv:black]
description = Check code formatting with black
skip_install = true
deps = black>=24.0.0
commands =
    poetry run black --check backend/ tests/ main.py

[testenv:black-fix]
description = Format code with black
skip_install = true
deps = black>=24.0.0
commands =
    poetry run black backend/ tests/ main.py

[testenv:flake8]
description = Run flake8 linter
skip_install = true
deps = flake8>=7.0.0
commands =
    poetry run flake8 backend/ tests/ main.py --count --statistics --max-line-length=88 --extend-ignore=E203,W503

[testenv:mypy]
description = Run mypy type checker
skip_install = true
deps =
    mypy>=1.19.1
    boto3-stubs>=1.42.27
commands =
    poetry run mypy backend/ main.py main.ipynb

[testenv:ruff]
description = Run ruff linter
skip_install = true
deps = ruff>=0.15.0
commands =
    poetry run ruff check backend/ tests/ main.py main.ipynb

[testenv:ruff-fix]
description = Auto-fix issues with ruff
skip_install = true
deps = ruff>=0.15.0
commands =
    poetry run ruff check --fix backend/ tests/ main.py
    poetry run ruff format backend/ tests/ main.py

[testenv:check]
description = Run all checks (ruff, black, flake8, mypy, tests)
skip_install = true
deps =
    ruff>=0.15.0
    black>=24.0.0
    flake8>=7.0.0
    mypy>=1.19.1
    boto3-stubs>=1.42.27
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-mock>=3.11.1
commands =
    poetry run ruff check backend/ tests/ main.py
    poetry run black --check backend/ tests/ main.py
    poetry run flake8 backend/ tests/ main.py --count --statistics --max-line-length=88 --extend-ignore=E203,W503
    poetry run mypy backend/ main.py
    poetry run pytest tests/ -v --cov=backend --cov-report=term-missing

[testenv:fix]
description = Auto-fix issues (ruff and black formatting)
skip_install = true
deps =
    ruff>=0.15.0
    black>=24.0.0
commands =
    poetry run ruff check --fix backend/ tests/ main.py
    poetry run ruff format backend/ tests/ main.py
    poetry run black backend/ tests/ main.py

# Flake8 configuration
[flake8]
max-line-length = 88
extend-ignore = E203, W503, E501
exclude =
    .git,
    __pycache__,
    .venv,
    .tox,
    build,
    dist,
    *.egg-info,
    .mypy_cache,
    .pytest_cache
max-complexity = 10
per-file-ignores =
    __init__.py:F401
