[tool.poetry]
name = "backend-completeautomate"
version = "0.0.1"
description = ""
authors = ["Vimal Menon"]
readme = "README.md"
packages = [{include = "backend"}]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
resemble = "^1.7.0"
langchain-deepseek = "^1.0.1"
langchain-groq = "^1.1.1"
langchain-openai = "^1.1.6"
langchain-xai = "^1.2.0"
langchain-perplexity = "^1.1.0"
langchain = "^1.2.1"
ipython = "^9.9.0"
langchain-qwq = "^0.3.4"
youtube-transcript-api = "^1.2.4"
langchain-anthropic = "^1.3.3"
jinja2 = "^3.1.6"
langgraph = "^1.0.8"
pydantic = "^2.12.5"
boto3 = "^1.42.49"
langsmith = "^0.7.4"
google-api-python-client = "^2.190.0"
google-auth-httplib2 = "^0.3.0"
google-auth-oauthlib = "^1.2.4"
playwright = "^1.54.0"
nicegui = "^3.8.0"
plotly = "^6.6.0"
dashscope = "^1.24.6"

[tool.poetry.scripts]
app = "main:main"

[tool.poetry.group.dev.dependencies]
mypy = "^1.19.1"
boto3-stubs = "^1.42.27"
pytest-mock = "^3.11.1"
black = {extras = ["jupyter"], version = "^26.1.0"}
flake8 = "^7.0.0"
types-requests = "^2.32.4.20260107"
ruff = "^0.15.1"
pytest = "^9.0.2"
isort = "^8.0.0"
pytest-cov = "^7.0.0"
moto = "^5.1.21"
deadcode = "^2.4.1"
google-api-python-client-stubs = "^1.32.0"
types-jinja2 = "^2.11.9"
pyfaker = "^0.1"
tox = "^4.49.0"
faker = "^40.8.0"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
known_first_party = ["backend"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
  "jinja2",
  "jinja2.*",
  "nicegui",
  "nicegui.*",
  "pydantic",
  "pydantic.*",
  "youtube_transcript_api",
  "youtube_transcript_api.*",
  "openai",
  "openai.*",
  "langchain_qwq",
  "langchain_qwq.*",
  "langchain_perplexity",
  "langchain_perplexity.*",
    "langchain.*",
    "langchain_anthropic.*",
    "langchain_deepseek.*",
    "langchain_groq.*",
    "langchain_openai.*",
    "langsmith.*",
    "langgraph.*",
    "boto3.*",
    "resemble.*",
  "google_auth_oauthlib.*",
  "googleapiclient.*",
  "google.auth.*"
]
ignore_missing_imports = true



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
